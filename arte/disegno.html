<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piccoli artisti · Missione Puccini</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf2fa;color:#12345c;font-family:Arial,system-ui,sans-serif}header{background:#143f73;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px clamp(12px,3vw,36px);gap:10px}header a{color:white;font-size:clamp(16px,1.7vw,21px);font-weight:800;white-space:nowrap}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(14px,1.5vw,20px)}.brand img{width:58px;height:58px;object-fit:contain}main{max-width:1250px;margin:0 auto;padding:20px 16px 40px}h1{font-size:clamp(30px,4vw,52px);margin:8px 0 4px;color:#b62d3d}p{font-size:clamp(17px,1.7vw,22px);margin:8px 0 18px}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:white;padding:14px;border-radius:16px;box-shadow:0 3px 14px #16344b18;margin-bottom:14px}button,.tool{border:2px solid #bed0e4;border-radius:11px;padding:11px 14px;background:white;color:#12345c;font-size:clamp(16px,1.5vw,20px);font-weight:800;cursor:pointer;min-height:49px}button[aria-pressed=true]{background:#174f8d;color:white;border-color:#174f8d}button:focus-visible,input:focus-visible{outline:4px solid #efb32d}label{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}.colors{display:flex;gap:6px;flex-wrap:wrap}.swatch{width:42px;height:42px;min-height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #637b91;padding:0}.swatch[aria-pressed=true]{box-shadow:0 0 0 4px #174f8d}input[type=range]{width:125px}input[type=color]{width:48px;height:43px;border:0;background:transparent;cursor:pointer}.canvas-wrap{background:#fff;padding:10px;border-radius:17px;border:3px solid #c1d3e7;box-shadow:0 10px 25px #16344b22}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none;background:white;cursor:crosshair;border:1px solid #d5dce4;border-radius:7px}.status{font-size:16px;font-weight:700;min-height:24px;margin-top:12px}footer{text-align:center;padding:12px;color:#48617c;font-size:14px}@media(max-width:700px){.brand img{width:44px;height:44px}.tools{gap:7px;padding:10px}button,.tool{padding:8px 10px}.swatch{width:36px;height:36px;min-height:36px}header{padding:9px}}
</style></head><body><header><div class="brand"><img src="../logo_istituto_trasparente.png" alt="Logo I.C. Armando Sforzi"><span>I.C. Armando Sforzi<br>Istituto Comprensivo</span></div><a href="index.html">← Scegli attività</a></header><main><h1>🎨 Piccoli artisti</h1><p>Usa il dito, il mouse o la penna della LIM per disegnare. La tela è tutta tua!</p><div class="tools" role="toolbar" aria-label="Strumenti di disegno"><button id="pencil" aria-pressed="true">✏️ Matita</button><button id="brush" aria-pressed="false">🖌️ Pennello</button><button id="eraser" aria-pressed="false">◻️ Gomma</button><div class="colors" aria-label="Colori"><button class="swatch" style="background:#171717" data-color="#171717" aria-label="Nero" aria-pressed="true"></button><button class="swatch" style="background:#e53535" data-color="#e53535" aria-label="Rosso" aria-pressed="false"></button><button class="swatch" style="background:#f4c32d" data-color="#f4c32d" aria-label="Giallo" aria-pressed="false"></button><button class="swatch" style="background:#2277e5" data-color="#2277e5" aria-label="Blu" aria-pressed="false"></button><button class="swatch" style="background:#2b9c58" data-color="#2b9c58" aria-label="Verde" aria-pressed="false"></button><button class="swatch" style="background:#a448c7" data-color="#a448c7" aria-label="Viola" aria-pressed="false"></button></div><label>Altro colore <input id="custom" type="color" value="#171717" aria-label="Scegli un altro colore"></label><label>Spessore <input id="size" type="range" min="2" max="48" value="8"><output id="sizeout">8</output></label><button id="undo">↶ Annulla</button><button id="clear">🗑️ Cancella tutto</button><button id="save">⬇️ Salva PNG</button></div><div class="canvas-wrap"><canvas id="canvas" width="1600" height="900" aria-label="Tela da disegno interattiva"></canvas></div><div class="status" id="status" role="status" aria-live="polite">Pronto per disegnare!</div></main><footer>Scuola Media G. Puccini · Prof. Marco Cigolotti · Nessun dato personale richiesto</footer><script>
(()=>{'use strict';const c=document.getElementById('canvas'),ctx=c.getContext('2d',{willReadFrequently:false});let tool='pencil',color='#171717',size=8,drawing=false,last=null,history=[];const status=document.getElementById('status');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);function snapshot(){if(history.length>=20)history.shift();history.push(ctx.getImageData(0,0,c.width,c.height))}function select(t){tool=t;['pencil','brush','eraser'].forEach(id=>document.getElementById(id).setAttribute('aria-pressed',String(id===t)))}['pencil','brush','eraser'].forEach(id=>document.getElementById(id).addEventListener('click',()=>select(id)));document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('custom').value=color;if(tool==='eraser')select('pencil')}));document.getElementById('custom').addEventListener('input',e=>{color=e.target.value;document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed','false'));if(tool==='eraser')select('pencil')});document.getElementById('size').addEventListener('input',e=>document.getElementById('sizeout').textContent=e.target.value);function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function stroke(a,b){const s=+document.getElementById('size').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=tool==='eraser'?'white':color;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=tool==='eraser'?s*2:tool==='brush'?s*1.6:s;ctx.globalAlpha=tool==='brush'?.75:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}c.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();snapshot();drawing=true;last=point(e);c.setPointerCapture(e.pointerId);stroke(last,last)});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);stroke(last,p);last=p});function stop(){drawing=false;last=null}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);c.addEventListener('lostpointercapture',stop);document.getElementById('undo').addEventListener('click',()=>{if(!history.length){status.textContent='Non ci sono tratti da annullare.';return}ctx.putImageData(history.pop(),0,0);status.textContent='Ultima azione annullata.'});document.getElementById('clear').addEventListener('click',()=>{if(!confirm('Vuoi cancellare tutto il disegno?'))return;snapshot();ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);status.textContent='Tela pulita.'});document.getElementById('save').addEventListener('click',()=>{const a=document.createElement('a');a.download='missione-puccini-il-mio-disegno.png';a.href=c.toDataURL('image/png');a.click();status.textContent='Disegno pronto per il download.'})})();
</script></body></html>
